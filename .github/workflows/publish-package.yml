# Auto-release @underverse-ui/document-preview on every push to main (npm Trusted Publishing / OIDC).
#
# scripts/auto-release.mjs decides what to do:
#   - package.json version not on npm yet (manual bump / `npm run release`) -> publish it
#   - otherwise, if src/, package.json, package-lock.json or README.md changed since the last tag:
#     breaking -> major (minor while 0.x), feat -> minor, anything else -> patch;
#     CI commits `chore(release): ...` + CHANGELOG back to main, tags vX.Y.Z, publishes, creates a GitHub Release
#   - "[skip release]" in the latest commit subject, or only tests/CI/scripts changed -> no release
#
# Keep this filename: the npm Trusted Publisher is bound to `publish-package.yml`.

name: Publish Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # release commit, tag, GitHub Release
  id-token: write # npm Trusted Publishing + provenance

concurrency:
  group: publish-document-preview
  cancel-in-progress: false

jobs:
  release:
    # The release commit pushed by this workflow uses GITHUB_TOKEN and does not retrigger it;
    # the guard also skips it if it ever does.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run check

      - name: Decide release
        id: plan
        run: node scripts/auto-release.mjs

      - name: Commit release, tag and push
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          BUMPED: ${{ steps.plan.outputs.bumped }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NAME=$(node -p "require('./package.json').name")
          if [ "$BUMPED" = "true" ]; then
            git add package.json package-lock.json CHANGELOG.md
            git commit -m "chore(release): $NAME@$VERSION [skip ci]"
            # Fails (and nothing is published) if main moved meanwhile; the next push releases.
            git push origin HEAD:main
          fi
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Inspect package contents
        if: steps.plan.outputs.release == 'true'
        run: npm pack --dry-run --ignore-scripts

      - name: Publish to npm
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          DIST_TAG="latest"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-([A-Za-z][A-Za-z0-9]*) ]]; then DIST_TAG="${BASH_REMATCH[1]}"; fi
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          npm publish --access public --ignore-scripts --tag "$DIST_TAG"

      - name: Create GitHub Release
        if: steps.plan.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          if gh release view "v$VERSION" >/dev/null 2>&1; then exit 0; fi
          PRERELEASE_FLAG=""
          if [ "$DIST_TAG" != "latest" ]; then PRERELEASE_FLAG="--prerelease"; fi
          gh release create "v$VERSION" --title "$NAME@$VERSION" --generate-notes $PRERELEASE_FLAG
