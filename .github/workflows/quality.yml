name: Repository Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run check

      - name: Inspect package contents
        run: npm pack --dry-run --ignore-scripts

  package-runtime:
    name: Package runtime (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Import the built entry points
        run: |
          node --input-type=module -e "const m = await import('./dist/utils.js'); if (typeof m.canPreviewDocumentFile !== 'function') throw new Error('utils ESM entry broken');"
          node -e "const m = require('./dist/utils.cjs'); if (typeof m.getDocumentPreviewFrame !== 'function') throw new Error('utils CJS entry broken');"
